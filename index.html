<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación lazy e identificación de patrones · Repaso interactivo</title>
<style>
:root{
  --bg:#f3f6fb; --panel:#ffffff; --ink:#13233f; --muted:#5b6b85; --line:#d9e1ee;
  --navy:#0f2747; --blue:#1d5fbf; --blue-soft:#e8f0fc; --code:#f5f8fd; --code-ink:#1b2a44;
  --ok:#17875a; --ok-soft:#e3f5ec; --bad:#c43b3b; --bad-soft:#fbe9e9; --warn:#b8741a; --warn-soft:#fdf2e1;
  --kw:#7b2fb5; --str:#1a7f4b; --num:#b4530b; --com:#7a879c; --fn:#1d5fbf;
  --shadow:0 1px 2px rgba(15,39,71,.06),0 6px 20px rgba(15,39,71,.06);
}
[data-theme="dark"]{
  --bg:#0c1424; --panel:#121d33; --ink:#e6ecf7; --muted:#9aa9c4; --line:#24324f;
  --navy:#081120; --blue:#6aa3ff; --blue-soft:#18284a; --code:#0a1222; --code-ink:#dfe7f5;
  --ok:#4cc68d; --ok-soft:#123326; --bad:#ff7b7b; --bad-soft:#3a1a1f; --warn:#f0b15a; --warn-soft:#3a2a12;
  --kw:#d29bff; --str:#7ee0a8; --num:#ffb36b; --com:#7f8ea8; --fn:#8cb8ff;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5}
header .t{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{display:block;font-weight:400;opacity:.7;font-size:12px}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.2)}
.bar{height:4px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.wrap{flex:1;display:flex;min-height:0}
nav#idx{width:290px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 0;flex-shrink:0}
nav#idx.hide{display:none}
nav#idx h4{margin:14px 16px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
nav#idx a{display:block;padding:5px 16px 5px 20px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
nav#idx a:hover{background:var(--blue-soft)}
nav#idx a.on{border-left-color:var(--blue);background:var(--blue-soft);font-weight:600}
nav#idx a.seen::after{content:" ✓";color:var(--ok);font-size:12px}
main{flex:1;overflow:auto;padding:28px 20px 40px}
.slide{max-width:1040px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{display:inline-block;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
h1{font-size:30px;line-height:1.2;margin:10px 0 18px}
h3{margin:0 0 8px;font-size:18px}
p{margin:0 0 12px}
.blk{margin:0 0 18px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.card.ok{border-top:4px solid var(--ok)} .card.bad{border-top:4px solid var(--bad)} .card.blue{border-top:4px solid var(--blue)}
.card ul{margin:0;padding-left:20px} .card li{margin:3px 0}
.tip{background:var(--blue-soft);border-left:4px solid var(--blue);padding:12px 16px;border-radius:0 10px 10px 0}
.tip.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.tip.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.def{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.def b{color:var(--blue)}
.codegrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.codegrid.solo{grid-template-columns:1fr}
.codegrid.two{grid-template-columns:1fr 1fr}
.codegrid>*,.trace>*,.pipe>*{min-width:0}
pre.code{margin:0;background:var(--code);color:var(--code-ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-size:15px;line-height:1.55;tab-size:4}
pre.code .ln{display:block;border-radius:4px;margin:0 -6px;padding:0 6px}
pre.code .ln.hl{background:rgba(29,95,191,.16);outline:1px solid rgba(29,95,191,.35)}
.kw{color:var(--kw);font-weight:600}.st{color:var(--str)}.nu{color:var(--num)}.cm{color:var(--com);font-style:italic}.bi{color:var(--fn)}
.out{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.out .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.out pre{margin:0;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:15px;white-space:pre-wrap;min-height:1.4em}
.out pre .new{animation:pop .35s ease}
@keyframes pop{from{background:var(--blue-soft)}to{background:transparent}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
[data-theme="dark"] .btn:not(.ghost){color:#081120}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.45;cursor:default}
.side{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:12px 14px}
.side .lbl{font-weight:700;color:var(--bad);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
table{border-collapse:collapse;width:100%;background:var(--panel);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);font-size:15.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-weight:600}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td code,p code,li code,.opt code,.fb code{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.92em;background:var(--code);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.tscroll{overflow-x:auto}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
figure img{width:100%;height:auto;display:block}
figcaption{color:#5b6b85;font-size:14px;text-align:center;margin-top:6px}
.pred{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pcard .tag{font-weight:800;color:var(--blue);font-size:18px}
.pcard textarea{width:100%;min-height:54px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,Consolas,monospace;font-size:14px;background:var(--bg);color:var(--ink)}
.ans{display:none;background:var(--ok-soft);border-radius:8px;padding:10px 12px}
.ans.show{display:block;animation:fade .25s}
.ans pre{margin:0 0 4px;font-family:ui-monospace,Consolas,monospace;font-weight:700}
.cls{display:grid;gap:12px}
.citem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.citem.done-ok{border-color:var(--ok);background:var(--ok-soft)}
.citem.done-bad{border-color:var(--bad);background:var(--bad-soft)}
.citem pre.code{font-size:14px;padding:8px 10px}
.copts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.copt{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px}
.copt:hover{border-color:var(--blue)}
.copt.ok{background:var(--ok);color:#fff;border-color:var(--ok)} .copt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.cfb{grid-column:1/-1;font-size:14.5px;display:none}
.cfb.show{display:block}
.score-mini{font-weight:700;color:var(--blue)}
.steps{display:grid;gap:10px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 54px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:11px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.step.dim{opacity:.35}
.badge{display:inline-block;background:var(--warn);color:#fff;font-weight:700;border-radius:999px;padding:2px 10px;font-size:13px;margin-left:8px;vertical-align:middle}
details.sol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.sol summary{cursor:pointer;font-weight:700;color:var(--blue)}
details.sol[open] summary{margin-bottom:10px}
.trace{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.state{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.state .msg{font-weight:600;margin-bottom:8px;min-height:3em}
.state .vars{font-family:ui-monospace,Consolas,monospace;font-size:14.5px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pgrid{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.pgrid h3{font-size:16px}
.pgrid.eager h3{color:var(--bad)} .pgrid.lazy h3{color:var(--ok)}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 1fr;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.prow.head{font-weight:700;color:var(--muted);font-size:13px}
.cell{border:2px solid var(--line);border-radius:8px;text-align:center;padding:4px 0;font-weight:700;color:var(--muted);transition:all .2s}
.eager .cell.on{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.lazy .cell.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.cell.now{transform:scale(1.08);box-shadow:0 0 0 3px rgba(29,95,191,.3)}
.cell.skip{opacity:.4}
.pinfo{margin-top:8px;font-size:14px;font-weight:600}
.cover{background:linear-gradient(135deg,var(--navy),#1d4f9c);color:#fff;border-radius:18px;padding:44px 40px;box-shadow:var(--shadow)}
.cover h1{font-size:38px;margin:14px 0 10px}
.cover .kicker{background:rgba(255,255,255,.15);color:#fff}
.cover p{opacity:.9;font-size:18px}
.cover .meta{opacity:.75;font-size:14px;margin-top:22px}
.cover .btn{background:#fff;color:var(--navy);margin-top:18px;font-size:16px;padding:10px 18px}
footer{background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
footer .cnt{color:var(--muted);font-size:14px;text-align:center;flex:1}
/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qprog{display:flex;gap:4px;flex-wrap:wrap}
.qdot{width:22px;height:8px;border-radius:4px;background:var(--line)}
.qdot.ok{background:var(--ok)}.qdot.bad{background:var(--bad)}.qdot.cur{background:var(--blue)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.qcard .qn{color:var(--muted);font-size:14px;font-weight:600}
.qcard .qt{font-size:19px;font-weight:600;margin:6px 0 12px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .l{font-weight:800;color:var(--blue);min-width:18px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt pre{margin:0;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;font-size:14.5px}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;display:none}
.fb.show{display:block;animation:fade .25s}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.result{text-align:center;padding:10px}
.ring{font-size:56px;font-weight:800;color:var(--blue);line-height:1}
.review{display:grid;gap:10px;margin-top:18px;text-align:left}
.rv{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:15px}
.rv.bad{border-left-color:var(--bad)}
.rv .y{color:var(--muted)}
@media (max-width:860px){
  nav#idx{position:fixed;top:56px;bottom:56px;left:0;z-index:6;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .codegrid,.codegrid.two,.trace,.pipe{grid-template-columns:1fr}
  h1{font-size:24px}.cover{padding:28px 22px}.cover h1{font-size:28px}
  main{padding:18px 12px 30px}
  .citem{grid-template-columns:1fr}.copts{justify-content:flex-start}
  .hbtn .tx{display:none}
  body{font-size:16px}
}
@media print{header,footer,nav{display:none}}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="bIdx" title="Índice">☰ <span class="tx">Índice</span></button>
  <div class="t">Evaluación lazy e identificación de patrones<small>Programación y Paradigmas Computacionales · UAEMéx</small></div>
  <button class="hbtn" id="bQuiz" title="Ir al cuestionario">✎ <span class="tx">Cuestionario</span></button>
  <button class="hbtn" id="bTheme" title="Modo claro/oscuro">☾ <span class="tx">Tema</span></button>
  <button class="hbtn" id="bDl" title="Descargar esta aplicación como archivo HTML">⬇ <span class="tx">Descargar HTML</span></button>
</header>
<div class="bar"><i id="prog"></i></div>
<div class="wrap">
  <nav id="idx"></nav>
  <main id="main"><div id="stage"></div></main>
</div>
<footer>
  <button class="btn ghost" id="bPrev">← Anterior</button>
  <div class="cnt" id="cnt"></div>
  <button class="btn" id="bNext">Siguiente →</button>
</footer>

{sec:'Parte 2 · Patrones', nav:'match / case básico', k:'match / case', t:'match / case básico', b:[

{sec:'Parte 2 · Patrones', nav:'Patrones de lista', k:'match / case', t:'Patrones de lista', b:[
  {t:'code', code:R`def describir(l):

{sec:'Integración y cierre', nav:'Lazy + patrones', k:'Integración', t:'Lazy + patrones: un flujo de eventos', b:[
  {t:'code', code:R`def eventos():

              {"tipo": "compra", "monto": 1500},

        yield e

def alertas(evs):
    for e in evs:
        match e:

/* ============ RESALTADO DE PYTHON ============ */
const KW = new Set('def return yield for in if else elif while True False None import from match case and or not with as lambda break continue is'.split(' '));
const BI = new Set('print next iter list range map filter sum len islice count open any all sorted str int sys'.split(' '));
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hlLine(src){
  const re = /(#[^\n]*)|([fr]?"(?:[^"\\\n]|\\.)*"|[fr]?'(?:[^'\\\n]|\\.)*')|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;
  let out='', last=0, m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index)); last=re.lastIndex;
    if(m[1]) out+='<span class="cm">'+esc(m[1])+'</span>';
    else if(m[2]) out+='<span class="st">'+esc(m[2])+'</span>';
    else if(m[3]) out+='<span class="nu">'+m[3]+'</span>';
    else { const w=m[4]; out+= KW.has(w)?'<span class="kw">'+w+'</span>': BI.has(w)?'<span class="bi">'+w+'</span>': w; }
  }
  return out+esc(src.slice(last));
}
function codeHTML(code){ return '<pre class="code">'+code.split('\n').map(l=>'<span class="ln">'+(hlLine(l)||' ')+'</span>').join('')+'</pre>'; }

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

    box.querySelector('.btn').onclick=()=>{newQuiz();render();};
    const rv=el('<div class="review"><h3>Revisión pregunta por pregunta</h3></div>');
    QZ.items.forEach((q,k)=>{ const a=QZ.ans[k];
      rv.appendChild(el('<div class="rv '+(a.ok?'':'bad')+'"><b>'+(k+1)+'. '+(a.ok?'✅':'❌')+'</b> '+q.q+(q.c?codeHTML(q.c):'')+(a.ok?'':'<div class="y">Tu respuesta: '+optHTML(q.o[a.sel])+'</div>')+'<div><b>Correcta:</b> '+optHTML(q.o[q.a])+'</div><div class="y">'+q.e+'</div></div>'));
    });
    box.appendChild(rv); return box;
  }
  const q=QZ.items[QZ.i];
  const dots=QZ.items.map((_,k)=>'<span class="qdot '+(k<QZ.ans.length?(QZ.ans[k].ok?'ok':'bad'):(k===QZ.i?'cur':''))+'"></span>').join('');
  const okSoFar=QZ.ans.filter(a=>a.ok).length;
  box.appendChild(el('<div class="qhead"><div class="qprog">'+dots+'</div><div class="score-mini">Aciertos: '+okSoFar+'</div></div>'));
  const card=el('<div class="qcard"><div class="qn">Pregunta '+(QZ.i+1)+' de '+n+'</div><div class="qt">'+q.q+'</div>'+(q.c?codeHTML(q.c):'')+'<div class="opts"></div><div class="fb"></div><div class="btns" style="justify-content:flex-end"><button class="btn" style="display:none">'+(QZ.i===n-1?'Ver resultados':'Siguiente pregunta')+' →</button></div></div>');
  const opts=card.querySelector('.opts'), fb=card.querySelector('.fb'), nb=card.querySelector('.btns .btn');
  q.ord.forEach((k,pos)=>{
    const b=el('<button class="opt"><span class="l">'+'ABCD'[pos]+'</span><span>'+optHTML(q.o[k])+'</span></button>');
    b.onclick=()=>{
      const good=k===q.a; QZ.ans.push({sel:k,ok:good});
      opts.querySelectorAll('.opt').forEach((x,p)=>{x.disabled=true; if(q.ord[p]===q.a)x.classList.add('ok');});
      if(!good) b.classList.add('bad');
      fb.className='fb show '+(good?'ok':'bad'); fb.innerHTML=(good?'✅ <b>¡Correcto!</b> ':'❌ <b>No es correcto.</b> ')+q.e;
      nb.style.display=''; nb.focus();
      box.querySelectorAll('.qdot')[QZ.i].className='qdot '+(good?'ok':'bad');
      box.querySelector('.qhead .score-mini').textContent='Aciertos: '+QZ.ans.filter(a=>a.ok).length;
    };
    opts.appendChild(b);
  });
  nb.onclick=()=>{QZ.i++;render();$('#main').scrollTop=0;};
  box.appendChild(card); return box;
}

/* ============ NAVEGACIÓN ============ */
function buildIdx(){
  const nav=$('#idx'); nav.innerHTML=''; let last='';
  S.forEach((s,i)=>{ if(s.sec!==last){nav.appendChild(el('<h4>'+s.sec+'</h4>'));last=s.sec;}
    const a=el('<a href="#">'+s.nav+'</a>'); a.onclick=e=>{e.preventDefault();go(i); if(innerWidth<=860)nav.classList.add('hide');}; nav.appendChild(a); });
}
function render(){
  const s=S[cur]; stage.innerHTML='';
  const sl=el('<div class="slide"></div>');
  if(s.cover){
    sl.appendChild(el('<div class="cover"><span class="kicker">Programación funcional · Repaso interactivo</span><h1>Evaluación lazy e identificación de patrones</h1><p>Dos herramientas del paradigma funcional para procesar datos con menos memoria y menos código. Con ejemplos en Python.</p><button class="btn">Comenzar repaso →</button><div class="meta">Programación y Paradigmas Computacionales · UAEMéx<br>'+S.length+' pantallas · actividades con retroalimentación · cuestionario final de '+QUIZ.length+' preguntas · match/case requiere Python 3.10+</div></div>'));
    sl.querySelector('.btn').onclick=()=>go(1);
  } else {
    sl.appendChild(el('<div><span class="kicker">'+s.k+'</span><h1>'+s.t+'</h1></div>'));
    s.b.forEach(b=>{ const n=R_[b.t](b); n.classList.add('blk'); sl.appendChild(n); });
  }
  stage.appendChild(sl);
  seen.add(cur);
  $('#cnt').textContent=(cur+1)+' / '+S.length+' · '+s.sec;
  $('#prog').style.width=((cur+1)/S.length*100)+'%';
  $('#bPrev').disabled=cur===0; $('#bNext').disabled=cur===S.length-1;
  document.querySelectorAll('#idx a').forEach((a,i)=>{a.classList.toggle('on',i===cur);a.classList.toggle('seen',seen.has(i)&&i!==cur);});
  const on=document.querySelector('#idx a.on'); if(on) on.scrollIntoView({block:'nearest'});
}
function go(i){ cur=Math.max(0,Math.min(S.length-1,i)); render(); $('#main').scrollTop=0; }
$('#bPrev').onclick=()=>go(cur-1); $('#bNext').onclick=()=>go(cur+1);
$('#bQuiz').onclick=()=>go(S.length-1);
$('#bIdx').onclick=()=>$('#idx').classList.toggle('hide');
$('#bTheme').onclick=()=>{const d=document.documentElement; const t=d.dataset.theme==='dark'?'light':'dark'; d.dataset.theme=t; try{localStorage.setItem('lazyTheme',t);}catch(e){}};
$('#bDl').onclick=()=>{const b=new Blob([ORIGINAL_HTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Evaluacion_Lazy_y_Patrones_Repaso.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};
document.addEventListener('keydown',e=>{ if(/TEXTAREA|INPUT/.test(e.target.tagName))return; if(e.key==='ArrowRight')go(cur+1); if(e.key==='ArrowLeft')go(cur-1); });
try{ const t=localStorage.getItem('lazyTheme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
if(innerWidth<=860) $('#idx').classList.add('hide');
let inFrame=true; try{inFrame=window.self!==window.top;}catch(e){}
if(inFrame) $('#bDl').style.display='none';
buildIdx(); render();
</script>
